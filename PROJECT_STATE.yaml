  godot_installed: true
  project_scaffolded: true
  assets_imported: true
  headless_smoke_test: true  # run: godot --path "C:\crypto\wicked whiskers" --headless -- --smoketest
    verifies the whole scene-1 loop with a random combo (last run: 440, after shed-scene split).
    smoke runs (console exe, windowed, --screenshot --pond) after the lake rework: PASS
    (SMOKE DONE; only the usual exit-time RID-leak noise in known_issues).
    shed scene: godot --path "C:\crypto\wicked whiskers" --headless res://scenes/shed.tscn -- --smoketest
    (last run: PASS - loot spawns 1 string + 1 key, exit portal present).
  screenshot_pipeline: true  # run: godot --path "C:\crypto\wicked whiskers" -- --screenshot
    overview shot: --screenshot --flyover -> screenshot_flyover.png (camera lifted above garden)
    close-up cat shot: --screenshot --catclose -> screenshot_catclose.png (freezes cam, aims at head)
    base shot -> screenshot.png
  scene1_layout:
    player start: (0,0,12), yaw 0.6, ground 60x60 + WorldBoundaryShape collision
    farmhouse: (0,0,-24), box build, gable roof, porch, door/windows on +Z, night-locked
    shed: (16,0,-10), EXTERIOR ONLY (solid box + overhang roof, door frame, dark door that
      swings open on unlock, padlock). Entry portal (ShedPortal, area in the doorway) switches
      to the shed's own scene (S1.5) once unlocked, with a 0.7s beat so the door swing reads.
      Return spawns the player near the shed door at (16,0,-7.2).
    shed_interior: scenes/shed.tscn = own scene (S1.5). Interior walls (doorway gap on +Z),
      floor, overhang roof, warm OmniLight, props: loot crates, boot-with-sprout, hay pile,
      sprung mousetrap, glowing lantern, rake, rope coil. Player spawns inside at (0,0,0.6)
      facing the door. Loot = string + spare tractor keys on the crates (one-time, tracked via
      shed_string_taken/shed_key_taken so re-entering can't farm them). Exit portal
      (ShedExitPortal) returns to the farm. DayNight runs here too so hunger/tiredness continue.
    tractor: (10,0,-20), red box build + 4 wheels + number plate
    pond: (-11,0,-16), sunken lake (S1 garden): deep dark bed + muddy shallows shelf for
      depth, metallic water with animated noise-normal ripples + sky reflections, torus bank
      ring half-buried, reeds + grass shoreline, orbiting glint + expanding ripple rings,
      one swimming fish under the surface; --pond screenshot camera
    bird tree: (20,0,-4), perched bird
    dumbleclaw: (4,0,-14), wizard cat (barrel body, robe, beard, glasses, pointy hat)
    mouse: (2,0,6.5), wander/flee AI + chase
    filler: ~20 trees, 12 rocks, crop row, 5 logs, 35 grass tufts, 7 stick pickups,
      fence perimeter; all PRIMITIVE placeholders (box/sphere/cylinder) pending beautify
  scripts:
    GameState.gd: new_game() (combo randi 100-999, 9 lives, day_time, hunger, tiredness,
      food days, catches, keys, shed_unlocked, shed loot taken flags, spawn_near_shed, quest,
      totals, materials_status), eat_food, lose_life, restart
    Hud.gd: hunger/energy bars, lives/food/gold/string/sticks counters, choice panel,
      padlock combo UI (▲▼ digits, ◀▶ nav, TRY LOCK/CANCEL), any_panel_open()
    DayNight.gd: sun + moon lights, moon mesh, 220-star field, ProceduralSkyMaterial
      tint (night/dusk/day, not too dark), is_day + first_dawn toast, hunger -1/day,
      tiredness drain over 0.8 day, exhaustion = lose life + restart (exhaustion teleport is
      shed-scene-aware: resets to the shed centre when inside the shed)
    main.gd: scene layout (farm garden + exterior-only shed with entry portal) + _run_smoke()
      for --smoketest + screenshot helpers (--screenshot / --flyover / --catclose / --pond) + spawn
      placement (near the shed door when returning from the shed scene)
    interactable.gd: base NPC/object script - box interaction volumes (interaction_box +
      interaction_center) with sphere-radius fallback; used by door, tractor, Dumbleclaw, mouse
    door.gd: shed combo-prompt unlock (tween door swing, padlock vanishes; loot now lives in
      the shed scene) / farmhouse night-locked then once-day catfood + scene-2 tease; box
      interaction volume
    shed.gd: Scene 1.5 root - builds the shed interior (floor/walls/roof/light/props),
      spawns one-time loot (string + keys on the crates), ShedExitPortal back to the farm,
      plus a --smoketest check (loot counts + portal present)
    tractor.gd: plate reveals combo, drive-to-bird-tree requires has_keys, rotating wheels,
      calls bird.knocked_by_tractor(); box interaction volume
    fish.gd: pond + swimming fish (circle swim + bob) under the surface. Lake built in
      _build_pond/_build_shore/_build_fish: interaction_box vector (not radius); translucent
      metallic water (alpha ~0.55, metallic 0.9, roughness 0.12) with NoiseTexture2D
      normal map scrolled via uv1_offset for living ripples + sky reflections; deep dark
      center bed + lighter muddy shallows shelf (no see-through edges); torus bank ring;
      reeds + grass tufts shoreline; orbiting glint + expanding/fading ripple rings.
      Rod crafted from the choice panel; catch adds food + advances quest
    mouse.gd: wander/flee + chase comedy (never catches), choice Chase/trap/leave, trap
      places trap scene + lures mouse to it (to_trap state), trap catch adds food; box volume
    bird.gd: perched bird, choices Climb(fails)/ladder/craft tractor(drive)/leave
    dumbleclaw.gd: quest state machine meet->advice, choices Ask advice / Trade surplus /
      Just passing, time-aware + missing-catch hints, 30-gold town gates tease
      (TOWN_GOLD_TARGET=30) + golden fish mention, surplus trade sells 1 food (food>2) for 10 gold
    pickup.gd: kinds string/stick/food/key (key = gold cylinder -> has_keys), loot_id
      (shed_string/shed_key) so one-time shed loot is tracked in GameState
    player.gd: ALWAYS-ON mouse-look (yaw/pitch). Camera-first _request_walk (swings the camera
      behind WW before he steps). Auto-follow lerp_angle(yaw, cat_facing + PI, 2.5*delta) unless
      _mouse_recent(350). WASD/arrows camera-relative (fwd=(-sin,-cos), right=(cos,-sin)).
      LMB click = precise _pick_interactable (screen-space dist + occlusion ray excluding own
      RIDs via _collect_rids), hold-LMB = keep walking toward cursor, press/release dead-zone
      (_press_pos/_press_moved). Proximity gating INTERACT_RANGE 1.8 + pending_interact
      (walk-then-interact). cat_facing decoupled from camera (cat faces walk direction).
      move_speed 3.0. E interact / 1 2 3 craft / F eat / Space jump / wheel zoom.
      TWO-PHASE raycast (areas/Interactables first so buildings don't swallow clicks, then
      bodies for ground), _clamp_camera_in_room() keeps the camera inside the walls while in
      the shed scene
    trap.gd / ladder.gd: craftable trap + ladder scenes
  player:
    status: working
    controls: ALWAYS-ON mouse-look (no button) + WASD/arrows camera-relative walk + LMB click =
      walk/interact (proximity-gated at 1.8) + LMB hold = keep walking + camera auto-follows
      behind WW when walking (unless the player is looking around) + scroll zoom (0.9-4.5,
      default 1.8) + Space jump + E interact, 1/2/3 craft trap/ladder/rod, F eat
    model: WW.glb (procedural Blender cartoon cat v0.3, rigged 25 bones, subdiv 3,
      ~164k verts, orange fur + cream muzzle/belly, eyes/nose/satchel, tapered-tube
      tail, chunky paws, ACTUAL WHISKERS = 3 thin tapered strands fanning from each cheek
      (Whisker material); ears = curved flattened blades + dark inner cup, bases sunk
      into head), scaled 0.19 to ~0.47m (real-cat size), positioned y=-0.0021
      so feet sit exactly on the ground, faces travel direction
    camera: third-person orbit at FACE level (holder y=0.5, cam z=1.8), slight down
      tilt (pitch 0.2), pitch clamped via _pitch_max() so camera can never go below
      the ground plane; auto-eases behind the cat when walking (2.5 lerp) unless the
      player moved the mouse in the last 350 ms; the cat itself keeps facing its walk
      direction (cat_facing), so the camera can orbit freely; ground made double-sided
      so it never disappears
    walk_animation: procedural bone cycle in player.gd _animate_cat() -
      set_bone_pose_rotation with get_bone_rest() base (IDENTITY does NOT mean rest -
      it points bones at the parent frame, a real bug we hit), diagonal trot
      (LF+RH together), knees fold only on the SWINGING leg, body sinks to match
      stance-leg arc so paws stay planted (no floating), phase advances by DISTANCE
      travelled so short clicks still produce visible steps
    idle_animation: breathing (Chest/Spine), head sway, tail swish, occasional ear twitch
    art_plan: Blender procedural pipeline (tools/blender/gen_ww.py) selected over
      AI gen (Meshy/Tripo) - user cannot download AI results; see docs/cat_prompts.md
  asset_pipeline:
    generator: Blender procedural (tools/blender/gen_ww.py, v0.3) -> WW.glb in assets/,
      run headless: blender.exe --background --python gen_ww.py
      NOTE: after re-running gen_ww.py, reimport in Godot editor so the .import cache
      refreshes (deleting .godot/imported forces a full reimport)
    blend_save: WW.blend saved OUTSIDE project (C:\crypto\wicked-whiskers-blender-out\)
      because a .blend inside res:// blocks editor import without a configured Blender path
    hero_cat: WW.glb (works - orange+cream + whiskers, verified via turntable viewer)
    prompts: docs/cat_prompts.md (Meshy + Tripo prompts kept as fallback if needed)
    licensing: free tiers = CC BY 4.0 public + attribution; Pro (~$20/mo) for private/commercial
  graphics_verification: Qwen Vision NOW WORKS for reviewing screenshots (qwen2.5vl:7b via
    vision_expert.ps1 - slow, ~4-6 min, needs ~12 GiB free RAM + num_ctx 1024; see project
    vision_tooling; model currently STOPPED to free memory). Lake reference photo saved to
    assets\pending\lake_reference.jpg and its feature list extracted (reflections, moving
    ripples, color/depth variation, reeded shoreline). First vision review of the pond shot:
    still read as a flat floating blue slab - the rework needs USER EYES in-game to judge.
    Historical method (pixel sampling) also used.

