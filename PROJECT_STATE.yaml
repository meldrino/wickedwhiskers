# GRASS RENDERING - CALIBRATED 1/10-SIZE SYSTEM PORTED INTO WW (2026-08-09)
# =============================================================================
grass_rendering:
  history:
    - 2026-08-07/08 hexaquo full-geometry + shader in the SANDBOX (temp grass_test
      folders) was CALIBRATED to 1/10 size: size_small 0.02 / size_large 0.04 with real
      blades ~0.05-0.12 m. Impostor far-plane approach proven: real blades near camera,
      shader impostor beyond ~20 m so the viewer never sees the LOD seam.
    - 2026-08-08 in-game (pre-port): VegetationGenerator + shaders/grass.gdshader +
      sward discs, ~335.4k tufts, full 120x120. USER: blades "way too long", then good
      coverage but only after sward discs.
    - 2026-08-09 PORT: the calibrated 1/10-size system moved into the game.
      VegetationGenerator.gd and shaders/grass.gdshader DELETED; replaced by the chunked
      system below. Sandbox experiment folders (grass_test / grass_part2 / grass_part3 /
      godot-grass) remain in temp ONLY - backup copies made (see backup section).
  approach: CHUNKED density system - near-tier 1M blades/chunk (40k/m2 detailed mesh),
    mid-tier 250k/chunk (10k/m2 simple mesh) in 5x5 m chunks streamed around the camera
    + mouse; a terrain-draped IMPOSTOR plane covers the far field (CENTRE (0,-6),
    HALF_X 32, HALF_Z 40, RES 1.0) so the LOD seam is never visible.
  files:
    scripts/grass_system.gd: owns materials + impostor; streams 5x5 chunks within
      STREAM_RADIUS 14 (CHUNK_SIZE 5.0); NEAR_RADIUS 6.0 (tier 0 detailed) / MID_RADIUS
      14.0 (tier 1 simple); centres = camera + Mouse node.
    scripts/grass_chunk.gd: NEAR_COUNT 1_000_000 / MID_COUNT 250_000 per 25 m2 chunk
      (40k/m2 detailed vs 10k/m2 simple). Multi-frame build: BUILD_PER_FRAME 250_000
      via _process, _mm.visible=false until done; MultiMesh set via
      set_instance_transform (NOT the .buffer array path - that silently failed and
      rendered the impostor only = the "painted grass" bug). Uses set_instance_transform.
    scripts/grass_impostor.gd: terrain-draped far plane (SurfaceTool), carves
      GrassExclusion + Terrain.water_level; local `vid` counter (SurfaceTool
      get_vertex_count() does NOT exist in Godot 4.7.1 - compile error).
    scripts/grass_game.gdshader: SIZES ALIGNED TO 1/10 SCALE - size_small 0.02 /
      size_large 0.04 (was 0.012/0.03). This is the CALIBRATED lock.
    scripts/impostor_grass.gdshader + assets/grass_normals.png: ported impostor shader
      (color_small 0.25/0.55/0.12, color_large 0.4/0.65/0.15, ground_color 0.06/0.12/0.04,
      patch_scale 7.0, wind_strength 0.04, wind_direction (1,0), wind_bend_strength 2.0,
      wind_ao_affect 1.5).
    scripts/grass_static.gd: STILL PRESENT but NO LONGER instantiated by grass_system.gd.
  gotchas:
    - NEW TEXTURE = run `--headless --import` first or preload fails
      ("no resource loaders (unrecognized file extension)").
    - SurfaceTool.get_vertex_count() does not exist (use a local counter).
    - `var i0 := ...` type-inference can fail under warnings-as-errors.
    - Full-render screenshots must be WINDOWED (not --headless), and the game starts at
      NIGHT - pass --noon or every capture is dark (GameState.gd day_time := 0.0).
    - BUILD_PER_FRAME 250_000 means a 1M-blade chunk takes several frames; screenshots
      taken mid-build can under-render (check chunk completion before judging).
  verified:
    - Screenshots into `small grass\` (NOT the project root, to avoid git noise):
      04_game_flyover.png (green frac 0.5798), 05_game_catclose.png (green frac 0.5936 -
      USER-APPROVED: "absolutely perfect, you nailed it!"), 06_game_pond.png
      (green frac 0.5769 - PROBLEM, see below). Screenshot modes: --catclose / --pond /
      --flyover in main.gd.
    - 05_game_catclose.png = the approved reference look (real near blades + far
      impostor reads as grass).
  problems:
    - 06_game_pond.png: near grass "no good" (mid tier = 10k/m2 reads too sparse) and
      "there is no pond" - the water is NOT in the rendered frame. Pixel analysis (3x3
      grid) showed ONLY grass rows 1-3 + sky row 0, ZERO water region, despite lake.gd
      running. --pond camera = Terrain.lake.center + y 9 = (-11,9,-16), look_at
      lake.center+(3.5,0,3.5) = (-7.5,0,-12.5). ROOT CAUSE NOT FOUND YET (investigation
      interrupted for the backup). Candidates: camera occlusion, water not built at that
