    close-up cat shot: --screenshot --catclose -> screenshot_catclose.png (freezes cam, aims at head)
    base shot -> screenshot.png
  scene1_layout:
    player start: (0,0,12), yaw 0.6, ground 60x60 + WorldBoundaryShape collision
    farmhouse: (0,0,-24), box build, gable roof, porch, door/windows on +Z, night-locked
    shed: (16,0,-10), WALK-IN interior (hollow walls + doorway gap, DoorBlock collision freed
      on unlock, swinging door, interior props: loot crates, boot-with-sprout, hay pile, sprung
      mousetrap, glowing lantern, rake, rope coil; warm interior light), string + spare tractor
      keys spawn on the crates. STILL part of the S1 scene - extracting it to its own scene is
      PENDING (requested: "the shed should be a completely different scene")
    tractor: (10,0,-20), red box build + 4 wheels + number plate
    pond: (-11,0,-16), rim + translucent water disc, one swimming fish
    bird tree: (20,0,-4), perched bird
    dumbleclaw: (4,0,-14), wizard cat (barrel body, robe, beard, glasses, pointy hat)
    mouse: (2,0,6.5), wander/flee AI + chase
    filler: ~20 trees, 12 rocks, crop row, 5 logs, 35 grass tufts, 7 stick pickups,
      fence perimeter; all PRIMITIVE placeholders (box/sphere/cylinder) pending beautify
  scripts:
    GameState.gd: new_game() (combo randi 100-999, 9 lives, day_time, hunger, tiredness,
      food days, catches, keys, shed_unlocked, quest, totals, materials_status), eat_food,
      lose_life, restart
    Hud.gd: hunger/energy bars, lives/food/gold/string/sticks counters, choice panel,
      padlock combo UI (▲▼ digits, ◀▶ nav, TRY LOCK/CANCEL), any_panel_open()
    DayNight.gd: sun + moon lights, moon mesh, 220-star field, ProceduralSkyMaterial
      tint (night/dusk/day, not too dark), is_day + first_dawn toast, hunger -1/day,
      tiredness drain over 0.8 day, exhaustion = lose life + restart
    main.gd: scene layout (incl. walk-in shed build + props) + _run_smoke() for --smoketest
      + screenshot helpers (--screenshot / --flyover / --catclose)
    interactable.gd: base NPC/object script - NEW box interaction volumes (interaction_box +
      interaction_center) with sphere-radius fallback; used by door, tractor, Dumbleclaw, mouse
    door.gd: shed combo-prompt unlock (tween door swing, padlock vanishes, DoorBlock freed so
      you can walk in, loot spawns on the crates) / farmhouse night-locked then once-day
      catfood + scene-2 tease; box interaction volume
    tractor.gd: plate reveals combo, drive-to-bird-tree requires has_keys, rotating wheels,
      calls bird.knocked_by_tractor(); box interaction volume
    fish.gd: pond + swimming fish (circle swim + bob), interaction radius 4.4, rod crafted
      inline from the choice panel, catch adds food + advances quest
    mouse.gd: wander/flee + chase comedy (never catches), choice Chase/trap/leave, trap
      places trap scene + lures mouse to it (to_trap state), trap catch adds food; box volume
    bird.gd: perched bird, choices Climb(fails)/ladder/craft tractor(drive)/leave
    dumbleclaw.gd: quest state machine meet->advice, choices Ask advice / Trade surplus /
      Just passing, time-aware + missing-catch hints, 30-gold town gates tease
      (TOWN_GOLD_TARGET=30) + golden fish mention, surplus trade sells 1 food (food>2) for 10 gold
    pickup.gd: kinds string/stick/food/key (key = gold cylinder -> has_keys)
    player.gd: KEY_3 rod, KEY_F eat, chase hop (0.45s, 0.7 jump), stop_walk(),
      clicks blocked during chase/panels, TWO-PHASE raycast (areas/Interactables first so
      buildings don't swallow clicks, then bodies for ground), _clamp_camera_in_shed() keeps
      the camera inside the shed walls when walking in
    trap.gd / ladder.gd: craftable trap + ladder scenes
  player:
    status: working
    controls: click-to-move (mouse-position raycast, NOT screen centre - fixed bug)
      + drag-to-orbit camera + scroll zoom (clamped 0.9-4.5, default 1.8) + Space jump,
      E interact, 1/2/3 craft trap/ladder/rod, F eat
    model: WW.glb (procedural Blender cartoon cat v0.3, rigged 25 bones, subdiv 3,
      ~164k verts, orange fur + cream muzzle/belly, eyes/nose/satchel, tapered-tube
      tail, chunky paws, ACTUAL WHISKERS = 3 thin tapered strands fanning from each cheek
      (Whisker material); ears = curved flattened blades + dark inner cup, bases sunk
      into head), scaled 0.19 to ~0.47m (real-cat size), positioned y=-0.0021
      so feet sit exactly on the ground, faces travel direction
    camera: third-person orbit at FACE level (holder y=0.5, cam z=1.8), slight down
      tilt (pitch 0.2), pitch clamped via _pitch_max() so camera can never go below
      the ground plane; ground made double-sided so it never disappears
    walk_animation: procedural bone cycle in player.gd _animate_cat() -
      set_bone_pose_rotation with get_bone_rest() base (IDENTITY does NOT mean rest -
      it points bones at the parent frame, a real bug we hit), diagonal trot
      (LF+RH together), knees fold only on the SWINGING leg, body sinks to match
      stance-leg arc so paws stay planted (no floating), phase advances by DISTANCE
      travelled so short clicks still produce visible steps
    idle_animation: breathing (Chest/Spine), head sway, tail swish, occasional ear twitch
    art_plan: Blender procedural pipeline (tools/blender/gen_ww.py) selected over
      AI gen (Meshy/Tripo) - user cannot download AI results; see docs/cat_prompts.md
  asset_pipeline:
    generator: Blender procedural (tools/blender/gen_ww.py, v0.3) -> WW.glb in assets/,
      run headless: blender.exe --background --python gen_ww.py
      NOTE: after re-running gen_ww.py, reimport in Godot editor so the .import cache
      refreshes (deleting .godot/imported forces a full reimport)
    blend_save: WW.blend saved OUTSIDE project (C:\crypto\wicked-whiskers-blender-out\)
      because a .blend inside res:// blocks editor import without a configured Blender path
    hero_cat: WW.glb (works - orange+cream + whiskers, verified via turntable viewer)
    prompts: docs/cat_prompts.md (Meshy + Tripo prompts kept as fallback if needed)
    licensing: free tiers = CC BY 4.0 public + attribution; Pro (~$20/mo) for private/commercial
  graphics_verification: model cannot view images; verified via pixel sampling
    (dusk sky, green ground, pond, buildings present) + user eyeballs screenshot.png

