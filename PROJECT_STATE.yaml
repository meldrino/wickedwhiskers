    STOP the model after use: ollama stop qwen2.5vl:7b (it nearly crashed the machine once).
  project_dir: "C:\\crypto\\wicked whiskers"
  docs_site: https://meldrino.com/forai/ww.html
  design_doc: "C:\\crypto\\wicked whiskers.docx"
  assets_source: "C:\\crypto\\world\\kenneys nature kit\\Models\\GLTF format"
