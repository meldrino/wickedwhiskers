      ring half-buried, reeds + grass shoreline, orbiting glint + expanding ripple rings,
      one swimming fish under the surface; --pond screenshot camera
    bird tree: (20,0,-4), perched bird
    dumbleclaw: (4,0,-14), wizard cat (barrel body, robe, beard, glasses, pointy hat)
    mouse: (2,0,6.5), wander/flee AI + chase
    filler: ~20 trees, 12 rocks, crop row, 5 logs, 35 grass tufts, 7 stick pickups,
      fence perimeter; all PRIMITIVE placeholders (box/sphere/cylinder) pending beautify
  scripts:
    GameState.gd: new_game() (combo randi 100-999, 9 lives, day_time, hunger, tiredness,
      food days, catches, keys, shed_unlocked, shed loot taken flags, spawn_near_shed, quest,
      totals, materials_status), eat_food, lose_life, restart
    Hud.gd: hunger/energy bars, lives/food/gold/string/sticks counters, choice panel,
      padlock combo UI (▲▼ digits, ◀▶ nav, TRY LOCK/CANCEL), any_panel_open()
    DayNight.gd: sun + moon lights, moon mesh, 220-star field, ProceduralSkyMaterial
