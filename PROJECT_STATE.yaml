# =============================================================================
# GAME STRUCTURE
# =============================================================================
sections:
  1_the_farm:
    content: Scene 1 (S1) = the farm GARDEN, the only scene built so far. Gather string
      (padlocked shed) + sticks (ground), craft a Heath-Robinson mousetrap / ladder / fishing
      rod, catch the mouse / bird / fish, meet Dumbleclaw (quests + surplus-food trade).
  2_the_farmhouse:
    content: Scene 2 (S2) = inside the farmhouse. Not yet built. Farmhouse door currently
      only teases it (catfood once at day).
  3_the_town:
    content: Scene 3 (S3) = the city (Dick Whittington style). Not yet built. The old
      "golden fish / unlock town gates" content moves here.
  plus: Not yet designed - open for future sections.

# =============================================================================
# DESIGN RULES (from conversation, canonical)
# =============================================================================
design_rules:
  wise_old_cat: Dumbleclaw - a feline version of Albus Dumbledore (long grey beard,
    half-moon spectacles, pointy hat). Quest giver + trader, sits in the garden at (4,0,-14).
  scenes: S1 farm garden (built), S2 inside farmhouse (future), S3 city Dick Whittington (future)
  interaction_model: NOT a linear ABC quest chain - each NPC/object is its own state machine
    / decision tree with click-choices (E interact, then pick from a choice panel).
  controls: E interact, 1 craft trap, 2 craft ladder, 3 craft rod, F eat
  catching_mice: chase NEVER succeeds (comedy face-plant). Catch = convoluted Mouse Trap only
    (board-game Mouse Trap / Heath-Robinson style), crafted from string + sticks, placed then
    mouse is lured onto it.
  catching_birds: perch on a tree. Catch = ladder (crafted) lean + climb, OR drive the tractor
    into the tree to knock the bird out.
  catching_fish: pond + one fish. Catch = rod ONLY (crafted from string + sticks). Paw attempt
    always fails ("that's oFISHial" toast).
  materials:
    string: found in the shed (padlocked)
    sticks: found on the ground (7 pickups)
    food: catfood from the farmhouse kitchen, ONCE per day at first light
    tractor_key: spare keys in the shed
  shed: padlocked. Combo = LAST 3 DIGITS of the tractor number plate. Combo randomizes on
    every new game (randi 100-999). Unlock by entering digits (▲▼/◀▶/TRY LOCK). Contains
    string + spare tractor keys.
  tractor: red tractor parked at (10,0,-20), plate reveals the combo (dialog "NUM %03d").
    Driving it to the bird tree requires the tractor key. Wheels rotate as it drives.
  farmhouse: night = locked ("can't get in till morning"). Day = once-only catfood +1
    (farmer's wife), then a tease of Scene 2.
  food_economy: food = 1 day. Food bar. Max 4 food total. Day = 2 real hours (7200 s).
    Game starts at dusk. Catfood only counts once/day at first light (first_dawn flag).
  tiredness: energy bar drains over 0.8 of a day. Sleep only allowed when actually tired
    (else refuses). Sleep does NOT cost food - food is tied to the DAY, not to sleeping.
  lives: 9 lives - retry challenges, progression milestones, humorous cat-astrophes.
    Exhaustion = lose a life + restart. Game over restarts Scene 1 with a FRESH combo.
  day_night: sun + moon + stars cross the sky; sky tinted (night/dusk/day), deliberately
    NOT pitch dark at night so the player can still see the garden.
  no_respawn: animals do not respawn once caught. Catchable in the daytime too (not night-only).
  dumbleclaw_quests: quest state machine (meet -> advice); choices Ask advice / Trade surplus /
    Just passing; hints depend on time of day + what's still missing; all 3 caught -> "30 gold
    opens the gates to the town" + golden fish tease; TRADES surplus food (food > 2) selling
    1 food for 10 gold per interaction (TRADE_GOLD=10).
  tone: humorous, cheeky, pun-filled (Purrfectly wicked, Pawsitively chaotic, "that's
    oFISHial", etc.)
  pacing: at least 1 hour total, broken into 10-minute periods so timelines can be recombined

