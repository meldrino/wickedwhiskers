# =============================================================================
# KNOWN ISSUES
# =============================================================================
known_issues:
  - exit-time leaked resource (RID) warnings are normal Godot noise on quick quit (not errors)
  - headless mode cannot render/view screenshots (get_image returns null) - windowed only
  - keeping a .blend inside the project blocks editor import (needs Blender path configured);
    .blend files must live outside res://
  - stale/zombie Godot processes hold the OLD WW.glb import; killing them (launcher does
    this) fixed inconsistent tuning behaviour
  - set_bone_pose_rotation(IDENTITY) aligns a bone with its parent frame, NOT the rest pose;
    must pass get_bone_rest(idx).basis rotation to return a bone to rest
  - walk animation is a sine approximation - keyframed Blender walk cycle is the future
    upgrade if the procedural gait isn't convincing enough
  - trees have no canopy collision (only trunk) - can jump over/through tops
  - Kenney GLB scale varies - some props may need per-model tuning
  - interactive set-pieces (padlock UI, tractor drive, chase) verified via the programmatic
    smoke test only, not yet by hand
  - ANSI flood = SGR MOUSE-TRACKING reports (ESC[<b;x;yM, e.g. "M[555;74;") flooding the
    console after an abnormal opencode exit: the TUI leaves mouse-tracking enabled (upstream
    @opentui cleanup order; GH anomalies/opencode #6912, #26198, #20458). FIXED via
    ~/.config/opencode/tui.json {"mouse": false} (disables TUI mouse capture; next opencode
    start). A plugin watching session.end could also emit the terminal-reset escapes. If the
    terminal still floods (e.g. opencode hard-killed), run C:\Users\Andy\fixterm.ps1.
