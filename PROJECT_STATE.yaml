  description: Pun-filled cat adventure on a farm and nearby Dick Whittington-style town.
    Mischief, chaos, cleverness, feline ingenuity. Craft-only catching (no manual catches).
  engine: Godot 4.7.1 stable
  editor_path: "C:\\crypto\\tools\\Godot_v4.7.1-stable_win64_console.exe"
